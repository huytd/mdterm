[package]
name = "mdterm"
version = "0.1.0"
description = "Terminal emulator with Markdown editor"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mdterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
dirs = "6.0"
portable-pty = "0.9.0"
serde_yaml = "0.9"
tauri-runtime = "2"

