name: Build & Bundle

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Harness (L1, L2, L3)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            tmux

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run L1 Rust tests
        run: cargo test -p mdterm

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run L2 Headless replay tests
        run: |
          cd tests/terminal
          npm ci
          npm test

      - name: Install Playwright WebKit
        run: |
          cd tests/terminal
          npx playwright install --with-deps webkit

      - name: Run L3 Visual & Geometry tests
        continue-on-error: true
        run: |
          cd tests/terminal
          npm run test:visual

  build-ubuntu:
    name: Build Linux (Ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust stable & wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk & Tauri CLI
        run: |
          cargo install trunk
          cargo install tauri-cli --version "^2.0.0"

      - name: Build Linux binary and .deb bundle
        run: cargo tauri build --bundles deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdterm-linux-ubuntu
          path: |
            target/release/mdterm
            target/release/bundle/deb/*.deb

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable & macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install Trunk & Tauri CLI
        run: |
          cargo install trunk
          cargo install tauri-cli --version "^2.0.0"

      - name: Build Universal macOS DMG and .app bundle
        run: cargo tauri build --target universal-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdterm-macos-universal
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app
